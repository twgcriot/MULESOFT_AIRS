[package]
name = "prisma_airs_scan"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2021"
resolver = "2"
description = "Flex Gateway policy that enforces Prisma AIRS runtime scanning"
license = "Apache-2.0"

[package.metadata.anypoint]
group_id = "00000000-0000-0000-0000-000000000000"
definition_asset_id = "prisma-airs-scan"
implementation_asset_id = "prisma-airs-scan-flex"

[package.metadata.flex]
min-version = "1.12.0"

[dependencies]
anyhow = "1.0"
pdk = { version = "1.11.0", features = ["enable_stop_iteration"] }
prisma-airs-scan-core = { path = "../prisma-airs-scan-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
pdk-test = "1.11.0"
pdk-unit = { version = "1.11.0", features = ["enable_stop_iteration"] }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "z"
strip = "debuginfo"
